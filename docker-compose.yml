version: '3.12'

services:
  web:
    build: .
    command: uv run manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: thesistrackerdjango.settings
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
