{% extends "base_noauth.html" %}

{% block content %}
<div class="main">
    <h1 class="m-2">Your Profile Information</h1>
    <div class="d-flex flex-column" style="width:35%">
        <form method="post" action="{% url 'profile' %}">
            {% csrf_token %}
            
            <div class="mb-3 d-flex align-items-center">
                <label for="username" class="me-2" style="width: 30%;">Username:</label>
                <input type="text" id="username" name="username" class="form-control" value="{{ user.username }}" required>
            </div>
            
            <div class="mb-3 d-flex align-items-center">
                <label for="email" class="me-2" style="width: 30%;">Email:</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
            
            <div class="mb-3 d-flex align-items-center">
                <label for="university" class="me-2" style="width: 30%;">University:</label>
                <input type="text" id="university" name="university" class="form-control" value="{{ user.university }}" required>
            </div>

            <div class="mb-3">
                <a href="{% url 'password_reset' %}" class="btn btn-outline-danger">Reset Password</a>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
