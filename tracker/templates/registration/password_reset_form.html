{% extends "base_noauth.html" %}

{% block content %}
<h2>Reset Your Password</h2>
<h3>Enter your email to receive a password reset link.</h3>
<br>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Send Reset Link</button>
</form>
{% endblock %}
