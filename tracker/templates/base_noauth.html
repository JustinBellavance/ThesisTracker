<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% load static %}
    <link rel="icon" href="{% static 'notepad.png' %}"></link>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/main.js' %}"></script>

    <title>ThesisTracker</title>
</head>
<body>
    <div class="container">
        <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-1 mb-2">
            <div>
                <a href="/" class="d-flex align-items-end text-decoration-none">
                    {% comment %} <img height="40" width="40" role="img" aria-label="Bootstrap" src="{% static 'notepad.png' %}" alt="Notepad Logo" class="me-2 mb-2.5"> {% endcomment %}
                    <h1 class="mb-0">ThesisTracker</h1>
                </a>
            </div>
        </header>
    </div>

      {% block content %}{% endblock %}
    
      {% comment %} <footer class="pt-4 my-md-8 pt-md-8 border-top">
        <div class="row">
          <small class="d-block mb-3 text-muted">© 2025</small>
        </div>
  </footer> {% endcomment %}
