<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% load static %}
    <link rel="icon" href="{% static 'notepad.png' %}"></link>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <title>ThesisTracker</title>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    <div class="container" style="flex: 1;">
        <header class="d-flex align-items-center justify-content-md-between py-1 mb-2">
            <div>
                <a href="/" class="d-flex align-items-end text-decoration-none">
                    <h1 class="mb-0">ThesisTracker</h1>
                </a>
            </div>
            <div class="auth-container">
                <form method="get" action="{% url 'index' %}">
                    {% csrf_token %}
                    <button type="submit">Home</button>
                </form>
            </div>
        </header>



        {% block content %}{% endblock %}
    </div>

    <footer class="pt-4 my-md-8 pt-md-8 border-top" >
        <div class="row">
            <medium class="d-block mb-3 text-muted text-center">Any comments or questions? Contact : justin.bellavance@gmail.com</medium>
        </div>
    </footer>
</body>
</html>
