<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% load static %}
    <link rel="icon" href="{% static 'notepad.png' %}"></link>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/main.js' %}"></script>

    <title>ThesisTracker</title>
</head>
<body>
    <div class="container">
        <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
          <a href="/" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
            <img class="bi me-2" width="40" height="40" role="img" aria-label="Bootstrap" src="{% static 'notepad.png' %}" alt="Notepad Logo">
            <h1 class="bi me-2">ThesisTracker</h1>
        </a>

      </div>

      {% block content %}{% endblock %}
    
      <footer class="pt-4 my-md-8 pt-md-8 border-top">
        <div class="row">
          <small class="d-block mb-3 text-muted">© 2025</small>
        </div>
  </footer>
